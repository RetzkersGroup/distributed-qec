[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ghz"
version = "0.1.0"
description = "Distributed quantum SE: Bell- and GHZ-based stabilizer measurements"
requires-python = ">=3.10"
authors = [{name = "Shoham Jacoby"}]
keywords = ["quantum", "error-correction", "stim", "distributed"]

dependencies = [
    "numpy>=1.20.0",
    "stim>=1.15.0",
]

[project.optional-dependencies]
sampling = ["sinter>=1.14.0", "pymatching>=2.0.0", "pandas"]
notebooks = ["jupyter", "ipython", "matplotlib", "pandas"]
tesseract = ["tesseract-decoder"]
bp = ["relay-bp", "beliefmatching", "stimbposd"]
# Peter-Jan Derks' gauge floquet colour-code numerics (tools/peterjan_tools/).
# `main` = OzYossarian/Kandel (the paper's stim compiler). Its own pins are very
# old (stim 1.10, numpy 1.23), so install with --no-deps against the current env;
# stimcirq/networkx/alive-progress are its runtime deps. See tools/peterjan_tools/README.md.
peterjan = [
    "kandel @ git+https://github.com/OzYossarian/Kandel",
    "stimcirq",
    "networkx",
    "alive-progress",
]
dev = ["pytest"]
all = ["distributed-ghz[sampling,notebooks,tesseract,bp,dev]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"
